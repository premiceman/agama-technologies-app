<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — Agama Technologies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.v2.css">
</head>
<body class="bg-body">
  <div class="container py-5" style="max-width:620px">
    <h1 class="mb-4">Create your account</h1>
    <form id="signupForm" class="card glass p-4">
      <div class="row g-3">
        <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" name="name" required></div>
        <div class="col-md-6"><label class="form-label">Company</label><input class="form-control" name="company"></div>
        <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
        <div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
        <div class="col-md-6"><label class="form-label">Role</label><input class="form-control" name="role"></div>
        <div class="col-md-6">
          <label class="form-label">Industry</label>
          <select class="form-select" name="industry">
            <option value="SaaS">SaaS</option>
            <option value="FinServ">FinServ</option>
            <option value="eCommerce">eCommerce</option>
            <option value="HealthTech">HealthTech</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="Other" selected>Other</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
    </form>
    <p class="mt-3 text-fg-3">Have an account? <a href="/login.html">Sign in</a></p>
  </div>
  <script>
    const form = document.getElementById('signupForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      const res = await fetch('/api/auth/signup', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body)
      });
      const json = await res.json();
      if(json.ok){ location.href = '/dashboard.html'; } else { alert(json.error || 'Signup failed'); }
    });
  </script>
</body>
</html>
