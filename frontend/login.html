<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Agama Technologies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-body">
  <div class="container py-5" style="max-width:520px">
    <h1 class="mb-4">Welcome back</h1>
    <form id="loginForm" class="card glass p-4">
      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div>
      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" name="password" required></div>
      <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3 text-fg-3">No account? <a href="/signup.html">Create one</a></p>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(form).entries());
      const res = await fetch('/api/auth/login', {
        method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify(body)
      });
      const json = await res.json();
      if(json.ok){ location.href = '/dashboard.html'; } else { alert(json.error || 'Login failed'); }
    });
  </script>
</body>
</html>
