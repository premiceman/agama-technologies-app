<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Agama Technologies</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.v2.css">
</head>
<body class="bg-body">
  <div class="liquid-bg" aria-hidden="true">
    <div class="blob blob-blue"></div>
    <div class="blob blob-teal"></div>
    <div class="blob blob-magenta"></div>
  </div>

  <div class="container py-5" style="max-width:520px">
    <div class="text-center mb-4">
      <a class="navbar-brand d-inline-flex align-items-center gap-2" href="/">
        <span class="brand-dot"></span>
        Agama <strong>Technologies</strong>
      </a>
      <p class="text-fg-3 small mt-2">Access ValueSphere, ProcurePath, and RevenueForge from your liquid-glass workspace.</p>
    </div>
    <form id="loginForm" class="card glass p-4">
      <h1 class="h4 mb-3">Welcome back</h1>
      <p class="text-fg-3 small mb-4">Enter your credentials to continue to the unified Agama workspace.</p>
      <div class="mb-3">
        <label class="form-label" for="loginEmail">Email</label>
        <input class="form-control" type="email" name="email" id="loginEmail" required autocomplete="email">
      </div>
      <div class="mb-4">
        <label class="form-label" for="loginPassword">Password</label>
        <input class="form-control" type="password" name="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary w-100" type="submit" id="loginSubmit">Sign in</button>
      <div class="form-text text-center mt-3" id="loginFeedback"></div>
    </form>
    <p class="mt-3 text-fg-3 text-center">No account yet? <a href="/signup.html">Create one</a></p>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const feedback = document.getElementById('loginFeedback');
    if (form) {
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        feedback.textContent = '';
        const submitBtn = document.getElementById('loginSubmit');
        if (submitBtn) submitBtn.disabled = true;
        const body = Object.fromEntries(new FormData(form).entries());
        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify(body)
          });
          const json = await res.json();
          if (res.ok && json.ok) {
            window.location.href = '/workspace.html';
          } else {
            feedback.textContent = json.error || 'Unable to sign in. Please check your details.';
          }
        } catch (err) {
          feedback.textContent = 'Network error. Please try again.';
        } finally {
          if (submitBtn) submitBtn.disabled = false;
        }
      });
    }
  </script>
</body>
</html>
