<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Agama Technologies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-body">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3">Dashboard</h1>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light" href="/assessment.html">New Assessment</a>
        <button class="btn btn-primary" id="logout">Logout</button>
      </div>
    </div>
    <div class="card glass p-3">
      <p class="text-fg-3">Run an assessment to generate your tailored maturity report.</p>
      <a href="/assessment.html" class="btn btn-primary">Start</a>
    </div>
  </div>
  <script>
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      location.href = '/';
    };
  </script>
</body>
</html>
