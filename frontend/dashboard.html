<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard — Agama Technologies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.v2.css">
</head>
<body class="bg-body">
  <div class="container py-5 report-wrapper">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
      <div>
        <span class="eyebrow">Client workspace</span>
        <h1 class="h3 mb-0">Your assessments</h1>
      </div>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light" href="/assessment.html">New assessment</a>
        <button class="btn btn-primary" id="logout">Logout</button>
      </div>
    </div>

    <div class="card glass p-4 mb-4">
      <h5 class="mb-3">Latest activity</h5>
      <div id="reports" class="d-flex flex-column gap-3"></div>
      <div id="emptyState" class="text-fg-3">Run your first assessment to generate a maturity report.</div>
    </div>
  </div>

  <script>
    document.getElementById('logout').onclick = async () => {
      await fetch('/api/auth/logout', { method:'POST', credentials:'include' });
      location.href = '/';
    };

    async function loadReports() {
      const res = await fetch('/api/reports', { credentials:'include' });
      if (res.status === 401) {
        location.href = '/login.html';
        return;
      }
      const json = await res.json();
      if (!json.ok) return;
      const container = document.getElementById('reports');
      container.innerHTML = '';
      if ((json.reports || []).length === 0) {
        document.getElementById('emptyState').style.display = 'block';
        return;
      }
      document.getElementById('emptyState').style.display = 'none';
      json.reports.forEach(rep => {
        const card = document.createElement('div');
        card.className = 'notice';
        card.innerHTML = `
          <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div>
              <div class="small text-fg-3">${new Date(rep.createdAt).toLocaleString()}</div>
              <div><strong>${rep.vertical}</strong> · Score <span class="grad">${rep.headlineScore}</span></div>
            </div>
            <div class="d-flex gap-2">
              <a class="btn btn-primary btn-sm" href="/report.html?id=${rep._id}">${rep.paid ? 'View full report' : 'View preview'}</a>
            </div>
          </div>`;
        container.appendChild(card);
      });
    }

    loadReports();
  </script>
</body>
</html>
