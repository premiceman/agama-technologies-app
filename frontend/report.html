<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Report — Agama Technologies</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-body">
  <div class="container py-4" style="max-width:900px">
    <div id="content" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3">Maturity Report</h1>
        <div><a href="/dashboard.html" class="btn btn-outline-light">Dashboard</a></div>
      </div>
      <div class="card glass p-3 mb-3">
        <div class="d-flex align-items-center gap-3">
          <div class="badge-pill">Overall Score</div>
          <div class="h4 m-0" id="headlineScore">--</div>
        </div>
        <p class="text-fg-3 mb-0" id="summary">Loading...</p>
      </div>

      <div class="row g-3">
        <div class="col-md-6">
          <div class="card glass p-3">
            <h5>Pillar Scores</h5>
            <ul id="pillars" class="mb-0"></ul>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card glass p-3">
            <h5>Benchmarks</h5>
            <div id="bench" class="text-fg-3"></div>
          </div>
        </div>
      </div>

      <div class="card glass p-3 my-3">
        <h5>Recommendations</h5>
        <ol id="recs"></ol>
        <div id="locked" class="mt-3 d-none">
          <div class="locked p-3 bg-dark rounded-3">
            The remainder of your detailed recommendations, vendor options, and budget-aligned plan are available with the full report.
          </div>
          <button id="unlock" class="btn btn-primary mt-3">Unlock full report (mock payment)</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function qs(k){ return new URLSearchParams(location.search).get(k); }
    const id = qs('id');

    async function load() {
      const res = await fetch('/api/reports/' + id, { credentials:'include' });
      const json = await res.json();
      if(!json.ok){ alert('Error loading report'); return; }
      const r = json.report;
      document.getElementById('headlineScore').textContent = r.headlineScore;
      document.getElementById('summary').textContent = r.summary;
      const ul = document.getElementById('pillars'); ul.innerHTML = '';
      Object.entries(r.pillarScores).forEach(([k,v]) => {
        const li = document.createElement('li'); li.textContent = k + ': ' + v; ul.appendChild(li);
      });
      const b = r.benchmarks?.medians || {};
      document.getElementById('bench').textContent = 'Vertical: ' + (r.benchmarks?.vertical||'n/a') + ' — Overall median: ' + (b.overall||'n/a');
      const recs = document.getElementById('recs'); recs.innerHTML = '';
      r.recommendations.forEach(x => { const li = document.createElement('li'); li.textContent = x; recs.appendChild(li); });
      document.getElementById('content').classList.remove('d-none');
      if (r.partial) document.getElementById('locked').classList.remove('d-none');
      else document.getElementById('locked').classList.add('d-none');
    }

    document.addEventListener('click', async (e) => {
      if (e.target.id === 'unlock') {
        e.target.disabled = true;
        const res = await fetch('/api/payments/mock/checkout', {
          method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include',
          body: JSON.stringify({ reportId: id })
        });
        const json = await res.json();
        if (json.ok) location.reload();
        else { alert('Payment failed'); e.target.disabled = false; }
      }
    });

    load();
  </script>
</body>
</html>
