<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join Engagement Room — Agama Technologies</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="/css/styles.v2.css">
</head>
<body class="bg-body">
  <div class="liquid-bg" aria-hidden="true">
    <div class="blob blob-blue"></div>
    <div class="blob blob-teal"></div>
    <div class="blob blob-magenta"></div>
  </div>

  <div class="container py-5" style="max-width: 720px;">
    <div class="card glass p-4">
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-2">
        <div>
          <span class="eyebrow">Engagement Rooms</span>
          <h1 class="h4 mb-1">Joining an Engagement Room</h1>
          <p class="text-fg-3 small mb-0">We are validating your invitation and preparing access.</p>
        </div>
        <div class="badge-soft">Secure invite</div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
        <div>
          <div class="fw-semibold" id="roomInviteStatus">Checking your invite...</div>
          <div class="text-fg-3 small">You will be redirected once the invite is accepted.</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/rooms.js"></script>
</body>
</html>
