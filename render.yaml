services:
  - type: web
    name: agama-tech
    rootDir: backend
    runtime: node
    buildCommand: npm install --no-audit --no-fund && npm run build-frontend
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
