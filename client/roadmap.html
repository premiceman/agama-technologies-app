<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roadmap | Agama</title>
    <link rel="stylesheet" href="css/styles.v2.css" />
  </head>
  <body class="bg-body">
    <div class="liquid-bg">
      <div class="blob blob-blue"></div>
      <div class="blob blob-teal"></div>
      <div class="blob blob-magenta"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
      <a class="navbar-brand" href="index.html">Agama</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="projects.html">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="assessment-new.html">Assessments</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="rfx-new.html">RFX</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="comparison-new.html">Comparisons</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="roadmap.html">Roadmaps</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="consulting.html">Consulting</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="projects.html#admin">Admin</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="vendor.html">Vendor</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row g-4">
        <section class="col-xl-9">
          <div class="card glass p-4 mb-4">
            <div
              class="d-flex flex-column flex-md-row gap-3 align-items-md-end justify-content-between"
            >
              <div>
                <h1 class="h4 mb-2">Roadmap workspace</h1>
                <p class="text-fg-3 mb-0">
                  Compose initiatives driven by assessment deltas, adjust dates,
                  and export for stakeholder reviews.
                </p>
              </div>
              <div class="d-grid gap-2">
                <label class="form-label" for="roadmap-project">Project</label>
                <select class="form-select" id="roadmap-project"></select>
              </div>
            </div>
          </div>

          <div class="card glass p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h2 class="h5 mb-0">Initiatives</h2>
              <div class="d-flex gap-2">
                <button class="btn btn-outline-light" id="generate-roadmap">
                  Generate from assessments
                </button>
                <button class="btn btn-primary" id="save-roadmap">
                  Save roadmap
                </button>
              </div>
            </div>
            <div id="roadmap-initiatives" class="d-grid gap-3"></div>
          </div>
        </section>

        <aside class="col-xl-3">
          <div class="card glass p-4">
            <h2 class="h5 mb-3">Copilot suggestions</h2>
            <div id="roadmap-copilot" class="d-grid gap-3"></div>
            <button
              class="btn btn-outline-light mt-3"
              id="refresh-roadmap-copilot"
            >
              Refresh
            </button>
          </div>
        </aside>
      </div>
    </main>

    <script src="js/nav.js"></script>
    <script src="js/roadmap.js"></script>
  </body>
</html>
