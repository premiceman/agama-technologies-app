<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | Agama</title>
    <link rel="stylesheet" href="css/styles.v2.css" />
  </head>
  <body class="bg-body">
    <div class="liquid-bg">
      <div class="blob blob-blue"></div>
      <div class="blob blob-teal"></div>
      <div class="blob blob-magenta"></div>
    </div>
    <nav class="navbar navbar-expand-lg navbar-dark px-4 py-3">
      <a class="navbar-brand" href="index.html">Agama</a>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5">
          <div class="card glass p-5">
            <h1 class="h3 mb-3">Welcome back</h1>
            <p class="text-fg-3 mb-4">Sign in to access your organisation, projects, and copilots.</p>
            <form id="login-form" class="d-grid gap-3">
              <div>
                <label class="form-label" for="login-email">Email</label>
                <input class="form-control" id="login-email" name="email" type="email" required />
              </div>
              <div>
                <label class="form-label" for="login-password">Password</label>
                <input class="form-control" id="login-password" name="password" type="password" required />
              </div>
              <div id="login-error" class="text-danger" hidden>Invalid credentials. Please try again.</div>
              <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
            <p class="text-fg-3 mt-4 mb-0">Need an account? <a href="signup.html">Create one</a>.</p>
          </div>
        </div>
      </div>
    </main>
    <script src="js/auth.js"></script>
  </body>
</html>
